<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons gate — BAD fixture (must FAIL)</title>
<style>
  body { font: 16px/1.4 system-ui; margin: 0; padding: 1.5rem; background: #fff; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  /* custom buttons: no :active, no :hover, focus outline removed */
  .b { border: 0; border-radius: 6px; padding: 0 10px; height: 26px; font: inherit; background: #34c759; color: #fff; outline: none; cursor: pointer; margin: 0; }
  .solid { background: #0a84ff; color: #fff; height: 44px; padding: 0 18px; }
  .solid2 { background: #ff9f0a; color: #fff; height: 44px; padding: 0 18px; }
  .tall { height: 64px; }
  .fake { display: inline-block; padding: 12px 18px; background: #eee; border-radius: 8px; cursor: pointer; }
  .off { background: #0a84ff; color: #fff; height: 44px; padding: 0 18px; }
  .row { display: flex; gap: 0; margin-block: 1rem; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; }
</style>
</head>
<body>
  <h1>Bad buttons</h1>
  <!-- icon-only, no name, tiny hit region, no press/focus -->
  <button class="b" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></button>
  <!-- clickable div -->
  <div class="fake" onclick="void 0">Open settings</div>
  <div class="row">
    <button class="b solid" type="button">Save</button>
    <button class="b solid2" type="button">Upgrade</button>
    <button class="b solid tall" type="button">Publish</button>
    <button class="b solid" type="submit" data-role="primary" autofocus>Delete account</button>
  </div>
  <!-- low contrast label on light green -->
  <button class="b" type="button" style="background:#34c759;height:44px;padding:0 18px">Continue</button>
  <div class="row">
    <button class="b off" type="button" disabled>Next</button>
    <button class="b off" type="button">Back</button>
    <button class="b off" type="button" aria-haspopup="dialog">Rename</button>
  </div>
  <!-- two help buttons, busy but still clickable -->
  <button class="b" type="button" aria-label="Help" style="height:44px;width:44px">?</button>
  <button class="b" type="button" aria-label="Help" style="height:44px;width:44px">?</button>
  <button class="b off" type="button" aria-busy="true"><span class="spin" aria-hidden="true"></span> Checking out…</button>
</body>
</html>
