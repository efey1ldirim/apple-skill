<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons gate — GOOD fixture (must PASS)</title>
<link rel="stylesheet" href="../../../skills/apple-ui/tokens/apple-system-colors.css">
<link rel="stylesheet" href="../../../skills/apple-ui/tokens/apple-feedback.css">
<link rel="stylesheet" href="../../../skills/apple-ui/tokens/apple-buttons.css">
<style>
  body { font: 16px/1.4 system-ui; margin: 0; padding: 1.5rem; background: #fff; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  header { display: flex; align-items: center; justify-content: space-between; margin-block-end: 1.5rem; }
  section { margin-block: 1.5rem; max-inline-size: 26rem; }
  h1, h2 { margin: 0 0 .5rem; }
  .card { border-radius: 1rem; padding: 1rem; background: color-mix(in srgb, currentColor 5%, transparent); }
</style>
</head>
<body>
  <header>
    <h1>Order</h1>
    <button class="btn btn-icon btn-plain" type="button" aria-label="Share order" title="Share order">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 13v6h14v-6"/></svg>
    </button>
  </header>

  <section aria-labelledby="pay">
    <h2 id="pay">Payment</h2>
    <div class="btn-row">
      <button class="btn btn-prominent" type="submit">Pay $24.00</button>
      <button class="btn" type="button">Cancel</button>
    </div>
    <p class="fb-reason" id="why">Add a delivery address to continue.</p>
    <button class="btn" type="button" aria-disabled="true" aria-describedby="why">Continue</button>
  </section>

  <section aria-labelledby="chk">
    <h2 id="chk">Checkout</h2>
    <button class="btn btn-block" type="button" aria-busy="true" aria-disabled="true">
      <span class="btn__spinner" aria-hidden="true"></span><span>Checking out…</span>
    </button>
  </section>

  <section aria-labelledby="acc">
    <h2 id="acc">Account</h2>
    <div class="btn-stack">
      <a class="btn" href="/export">Export data</a>
      <button class="btn btn-destructive" type="button" aria-haspopup="dialog">Delete account…</button>
      <button class="btn btn-compact" type="button">Connect calendar</button>
    </div>
  </section>

  <section aria-labelledby="hlp">
    <h2 id="hlp">Help</h2>
    <button class="btn btn-icon" type="button" aria-label="Help" title="Help"><span aria-hidden="true">?</span></button>
  </section>
</body>
</html>
